<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,300&display=swap" rel="stylesheet">
        <link href="css/jee-style.css" rel="stylesheet" >
        <title>JEE Reporting</title>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-5 login-banner ">
                </div>
                <div class="col-md-7 mt-5 mt-md-0">
                    <div class="row">
                        <div class="col text-center">
                            <h1 class="jee-reporting-title font-size-42">JEE Reporting </h1>
                            <p class="tagline">Welcome back! Please login to your account.</p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 col-lg-7 col-xl-5 col-md-8 text-left mx-auto">
                            <form>
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control input-borderbottom-only px-1" id="floatingInput" placeholder="name@example.com">
                                    <label for="floatingInput" class="px-0">Email address</label>
                                </div>
                                <div class="form-floating">
                                    <input type="password" class="form-control input-borderbottom-only px-1" id="floatingPassword" placeholder="Password">
                                    <label for="floatingPassword"  class="px-0">Password</label>
                                </div>

                                <div class="my-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                    <label class="form-check-label" for="exampleCheck1">Remember me</label>
                                </div>
                                <div class="d-grid mt-5">
                                    <button type="button" class="btn btn-block btn-primary secondary-btn text-white">Login</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Option 2: Separate Popper and Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" ></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.min.js"></script>

    </body>
</html>
