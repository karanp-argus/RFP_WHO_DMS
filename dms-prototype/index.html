     never the wrong theme; next-themes replaces it on mount if a stored
     preference says otherwise. -->

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WHO Health Accounts Data Management System — front-end prototype"
    />
    <title>Health Accounts DMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
